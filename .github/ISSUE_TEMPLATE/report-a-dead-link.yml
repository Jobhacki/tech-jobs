name: "Report a dead link"
description: "Tell us about a listing in the Tech and software jobs list that no longer works"
title: "[Dead link] "
body:
  - type: input
    id: link
    attributes:
      label: "Link that no longer works"
      description: "The apply link as shown in the list."
      placeholder: "https://"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: "Job title and employer"
      description: "As shown in the list."
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: "What do you see?"
      options:
        - "The page says the job was not found (404)"
        - "The posting is marked filled or closed"
        - "The link goes to a different job or page"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Anything else"
      description: "Include the tech role title, employer, link, and what the page shows when opened."
    validations:
      required: false
